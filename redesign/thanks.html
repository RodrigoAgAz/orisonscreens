<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanks · Orison Screens</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face { font-family:'Hammersmith One'; src:url('/assets/fonts/HammersmithOne-400.woff2') format('woff2'); font-weight:400; font-display:swap; }
@font-face { font-family:'Schibsted Grotesk'; src:url('/assets/fonts/SchibstedGrotesk.woff2') format('woff2'); font-weight:400 700; font-display:swap; }
@font-face { font-family:'IBM Plex Mono'; src:url('/assets/fonts/IBMPlexMono-500.woff2') format('woff2'); font-weight:500; font-display:swap; }
:root{
  --paper:#F2F2EF; --ink:#131418; --ink-2:#494F57; --ink-3:#797F88;
  --line:#D4D5CF; --amber:#F0A400;
  --display:'Hammersmith One','Arial Black',Arial,sans-serif;
  --body:'Schibsted Grotesk','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;
  display:grid;grid-template-rows:auto 1fr auto;
}
a{color:inherit}
:where(a,button):focus-visible{outline:2.5px solid var(--amber);outline-offset:3px}
.wrap{max-width:1300px;margin-inline:auto;padding-inline:clamp(20px,4vw,56px);width:100%}
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;height:66px}
.wordmark{display:inline-flex;align-items:center;gap:.62em;text-decoration:none;color:var(--ink)}
.wordmark svg{width:34px;height:34px;flex:none}
.lockup{display:flex;flex-direction:column;line-height:1;gap:.28em}
.name{font-family:var(--display);font-size:1.1rem;letter-spacing:.13em}
.lockup small{font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;color:var(--ink-3)}
main .wrap{display:grid;gap:24px;align-content:center;justify-items:start;padding-block:clamp(60px,12vh,140px)}
main .wrap>*{max-width:38em}
main{display:grid}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,5vw,3.6rem);line-height:1;letter-spacing:-.015em;margin:0;text-wrap:balance}
p{margin:0;color:var(--ink-2);font-size:1.1rem}
.eyebrow{font-family:var(--mono);font-size:.75rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.btn{
  display:inline-flex;align-items:center;gap:.6em;margin-top:8px;
  padding:.9em 1.4em;border:1.5px solid var(--ink);border-radius:3px;
  font:600 .95rem/1 var(--body);text-decoration:none;background:var(--amber);border-color:var(--amber);
  transition:background .25s,border-color .25s,color .25s;
}
.btn:hover{background:var(--ink);border-color:var(--ink);color:var(--paper)}
footer{border-top:1px solid var(--line);padding-block:28px 36px;font-size:.87rem;color:var(--ink-2)}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="wordmark" href="/">
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <g transform="translate(0 5)">
          <g transform="translate(32 28)">
            <g transform="rotate(45)"><rect x="-5" y="-20" width="10" height="17"/><line x1="-5" y1="-16" x2="5" y2="-16"/><line x1="-5" y1="-12" x2="5" y2="-12"/><line x1="-5" y1="-8" x2="5" y2="-8"/><line x1="0" y1="-20" x2="0" y2="-3"/></g>
            <g transform="rotate(135)"><rect x="-5" y="-20" width="10" height="17"/><line x1="-5" y1="-16" x2="5" y2="-16"/><line x1="-5" y1="-12" x2="5" y2="-12"/><line x1="-5" y1="-8" x2="5" y2="-8"/><line x1="0" y1="-20" x2="0" y2="-3"/></g>
            <g transform="rotate(-45)"><rect x="-5" y="-20" width="10" height="17"/><line x1="-5" y1="-16" x2="5" y2="-16"/><line x1="-5" y1="-12" x2="5" y2="-12"/><line x1="-5" y1="-8" x2="5" y2="-8"/><line x1="0" y1="-20" x2="0" y2="-3"/></g>
            <g transform="rotate(-135)"><rect x="-5" y="-20" width="10" height="17"/><line x1="-5" y1="-16" x2="5" y2="-16"/><line x1="-5" y1="-12" x2="5" y2="-12"/><line x1="-5" y1="-8" x2="5" y2="-8"/><line x1="0" y1="-20" x2="0" y2="-3"/></g>
            <circle cx="0" cy="0" r="1.5" fill="currentColor" stroke="none"/>
          </g>
          <path d="M22 56 L24 38 Q24 34 32 34 Q40 34 40 38 L42 56 Z"/>
          <path d="M30 56 L30 48 Q30 45 32 45 Q34 45 34 48 L34 56"/>
        </g>
      </svg>
      <span class="lockup"><span class="name">ORISON</span><small>SCREENS</small></span>
    </a>
  </div>
</header>

<main>
  <div class="wrap">
    <p class="eyebrow">Message sent</p>
    <h1>Thanks. We have it.</h1>
    <p>Your message is with us and someone will come back to you shortly. If it is urgent, email <a href="mailto:info@orisonscreens.com">info@orisonscreens.com</a> directly.</p>
    <a class="btn" href="/">Back to the site</a>
  </div>
</main>

<footer>
  <div class="wrap">&copy; 2026 Orison Screens Ltd</div>
</footer>

</body>
</html>
